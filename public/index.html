<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONLYBUILDINGS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header>
    <span class="wordmark">ONLYBUILDINGS</span>
    <span class="tagline">nothing but buildings. submit yours.</span>
  </header>

  <!-- Upload trigger -->
  <button class="upload-btn" id="uploadBtn" title="Submit a building">+</button>

  <!-- Upload modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="drop-inner" id="dropInner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <p>drop a building photo here</p>
          <span>or click to choose</span>
        </div>
        <img id="previewImg" class="preview-img" alt="preview" />
      </div>

      <div class="modal-status" id="modalStatus"></div>

      <button class="submit-btn" id="submitBtn" disabled>submit building</button>
    </div>
  </div>

  <!-- Masonry grid -->
  <main class="grid" id="grid"></main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="building" />
    <button class="lightbox-close" id="lightboxClose">×</button>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
